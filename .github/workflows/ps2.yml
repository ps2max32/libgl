# .github/workflows/ps2.yml of ps2max32/libgl (template: ci/libgl.yml of ps2max32/docker).
# Builds with the commits its ps2max.deps names (LLVM, maxsdk, ...), through
# the reusable build of ps2max32/docker: tests/glconf.elf from the checkout
# (MXGL) against the maxsdk of its ps2max.deps.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ps2:
    uses: ps2max32/docker/.github/workflows/build.yml@main
    with:
      build: make -C tests -j$(nproc) MXGL=$PWD OUT=$PWD/out
      artifacts: out/glconf.elf
      release: false
